name: Build Android APK

on:
  push:
    branches: [ main, native-android, "experiment/physical-instrument-prototype", "experiment/instrument-flow-v2", "experiment/material-time-flow-v3", "experiment/material-contact-fix-v3", "experiment/universal-physics-flow-v4", "experiment/universal-roles-materials-v5", "experiment/physical-pitch-calibration-v6", "experiment/physical-scan-all-v7", "experiment/physical-pitch-expression-v8", "experiment/physical-apt-interactions-v9", "experiment/physical-geometry-interaction-v10", "experiment/physical-object-flow-v11", "experiment/physical-universal-construction-v12" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: aiOra-android-0.7.8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android toolchain
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Physical instrument prototype regression
        run: |
          g++ -std=c++20 -O2 -Iapp/src/main/cpp \
            tests/physical_instrument_prototype.cpp \
            -o /tmp/aiora-physical-instrument-test
          /tmp/aiora-physical-instrument-test

      - name: Material-Time Flow v3 acoustic and chronology regression
        run: |
          g++ -std=c++20 -O2 -Iapp/src/main/cpp \
            tests/material_time_flow_v3_regression.cpp \
            -o /tmp/aiora-material-time-v3-test
          /tmp/aiora-material-time-v3-test

      - name: Material Contact M regression
        run: |
          g++ -std=c++20 -O2 -Iapp/src/main/cpp \
            tests/material_contact_v3_regression.cpp \
            -o /tmp/aiora-contact-v3-test
          /tmp/aiora-contact-v3-test

      - name: Universal Flow v4 energy/position/dual-wind regression
        run: |
          g++ -std=c++20 -O2 -Iapp/src/main/cpp \
            tests/universal_flow_v4_regression.cpp \
            -o /tmp/aiora-universal-flow-v4-test
          /tmp/aiora-universal-flow-v4-test

      - name: Universal Material Roles v5 regression
        run: |
          g++ -std=c++20 -O2 -Iapp/src/main/cpp \
            tests/universal_roles_v5_regression.cpp \
            -o /tmp/aiora-universal-roles-v5-test
          /tmp/aiora-universal-roles-v5-test

      - name: Physical pitch v6 calibration regression
        run: |
          g++ -std=c++20 -O2 -Iapp/src/main/cpp \
            tests/physical_pitch_v6_regression.cpp \
            -o /tmp/aiora-pitch-v6-test
          /tmp/aiora-pitch-v6-test

      - name: Rendered sound FFT and Find Frequency v6 regression
        run: |
          g++ -std=c++20 -O2 -Iapp/src/main/cpp \
            tests/physical_frequency_analyzer_v6_regression.cpp \
            -o /tmp/aiora-frequency-analyzer-test
          /tmp/aiora-frequency-analyzer-test

      - name: Whole instrument pitch scan v7 regression
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/physical_scan_all_v7_regression.cpp \
            -o /tmp/aiora-physical-scan-all-v7-test
          /tmp/aiora-physical-scan-all-v7-test

      - name: Continuous physical pitch expression v8 regression
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/physical_pitch_expression_v8_regression.cpp \
            -o /tmp/aiora-physical-bend-v8-test
          /tmp/aiora-physical-bend-v8-test

      - name: Universal APT and material interaction v9 regression
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/physical_apt_interaction_v9_regression.cpp \
            -o /tmp/aiora-apt-v9-test
          /tmp/aiora-apt-v9-test

      - name: Object flow v11 regression
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/physical_object_flow_v11_regression.cpp -o /tmp/aiora-object-flow-v11-test
          /tmp/aiora-object-flow-v11-test

      - name: Universal material v12 regression
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/physical_universal_material_v12_regression.cpp -o /tmp/aiora-material-v12-test
          /tmp/aiora-material-v12-test

      - name: Universal construction v12 integrated regression
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/physical_universal_construction_v12_regression.cpp -o /tmp/aiora-construction-v12-test
          /tmp/aiora-construction-v12-test

      - name: Guitar and contact feedback before-after regression
        run: |
          mkdir -p /tmp/aiora-v12-before
          git fetch --depth=1 origin d540bd9864f4b9f227576d3851196fdd3b4719a8
          git archive d540bd9864f4b9f227576d3851196fdd3b4719a8 app/src/main/cpp | tar -x -C /tmp/aiora-v12-before
          g++ -std=c++20 -O2 -pthread -DAIORA_BEFORE_FIX -I/tmp/aiora-v12-before/app/src/main/cpp tests/physical_guitar_feedback_regression.cpp -o /tmp/aiora-before
          /tmp/aiora-before
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp tests/physical_guitar_feedback_regression.cpp -o /tmp/aiora-after
          /tmp/aiora-after

      - name: Native project-limit regression tests
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/native_limit_regression.cpp \
            app/src/main/cpp/{ProjectCore.cpp,ProjectPlayback.cpp,ProjectCodec.cpp,ProjectStorage.cpp,FactoryPresets.cpp,NexdrumKit.cpp,SpectrachordVoice.cpp,FxProcessor.cpp,SongExport.cpp} \
            -o /tmp/aiora-native-limit-regression
          /tmp/aiora-native-limit-regression

      - name: Experimental v4 crash/ride physical layer regression
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/native_cymbal_v4_regression.cpp \
            app/src/main/cpp/{ProjectCore.cpp,ProjectPlayback.cpp,ProjectCodec.cpp,ProjectStorage.cpp,FactoryPresets.cpp,NexdrumKit.cpp,SpectrachordVoice.cpp,FxProcessor.cpp,SongExport.cpp} \
            -o /tmp/aiora-native-cymbal-v4-regression
          /tmp/aiora-native-cymbal-v4-regression

      - name: A/B original v3 vs optimized B/V/M audio and CPU benchmark
        run: |
          set -euo pipefail
          # Compile the original v3 engine separately, without altering the branch.
          git fetch --no-tags --depth=1 origin d3b303a7f01458ce15a18bc105f8cbc040c751c0
          BASE=/tmp/aiora-dsp-baseline
          git worktree add --detach "$BASE" d3b303a7f01458ce15a18bc105f8cbc040c751c0
          cp tests/native_cymbal_cpu_benchmark.cpp "$BASE/tests/native_cymbal_cpu_benchmark.cpp"
          g++ -std=c++20 -O3 -pthread -I"$BASE/app/src/main/cpp" \
            "$BASE/tests/native_cymbal_cpu_benchmark.cpp" \
            "$BASE/app/src/main/cpp/"{ProjectCore.cpp,ProjectPlayback.cpp,ProjectCodec.cpp,ProjectStorage.cpp,FactoryPresets.cpp,NexdrumKit.cpp,SpectrachordVoice.cpp,FxProcessor.cpp,SongExport.cpp} \
            -o /tmp/aiora-benchmark-baseline
          mkdir -p /tmp/aiora-original-pcm /tmp/aiora-optimized-pcm
          DSP_BENCH_PCM_DIR=/tmp/aiora-original-pcm /tmp/aiora-benchmark-baseline | tee /tmp/aiora-benchmark-original.txt
          # Compile the current optimized engine with the same flags and sound data.
          g++ -std=c++20 -O3 -pthread -Iapp/src/main/cpp \
            tests/native_cymbal_cpu_benchmark.cpp \
            app/src/main/cpp/{ProjectCore.cpp,ProjectPlayback.cpp,ProjectCodec.cpp,ProjectStorage.cpp,FactoryPresets.cpp,NexdrumKit.cpp,SpectrachordVoice.cpp,FxProcessor.cpp,SongExport.cpp} \
            -o /tmp/aiora-benchmark-optimized
          DSP_BENCH_PCM_DIR=/tmp/aiora-optimized-pcm /tmp/aiora-benchmark-optimized | tee /tmp/aiora-benchmark-optimized.txt
          python3 - <<'PY'
          import re, array, math
          from pathlib import Path
          def cases(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  if not line.startswith("DSP_BENCH "):
                      continue
                  m = re.fullmatch(
                      r"DSP_BENCH ([\w-]+) voices=(\d+) frames=(\d+) hash=([0-9a-f]+) ms=([\d.]+) energy=([\d.eE+-]+)",
                      line,
                  )
                  if not m:
                      raise SystemExit("Unexpected benchmark output: " + line)
                  name, voices, frames, fingerprint, milliseconds, energy = m.groups()
                  result[name] = (voices, frames, fingerprint, float(milliseconds), float(energy))
              return result
          before = cases("/tmp/aiora-benchmark-original.txt")
          after = cases("/tmp/aiora-benchmark-optimized.txt")
          if not before or before.keys() != after.keys():
              raise SystemExit("Incomplete reference/optimized benchmark cases")
          mismatch = []
          for name, b in before.items():
              a = after[name]
              delta = 100 * (b[3] - a[3]) / b[3] if b[3] else 0
              print(f"{name}: baseline={b[3]:.3f}ms optimized={a[3]:.3f}ms speedup={delta:+.1f}%")
              x = array.array("f")
              y = array.array("f")
              x.frombytes(Path(f"/tmp/aiora-original-pcm/{name}.f32").read_bytes())
              y.frombytes(Path(f"/tmp/aiora-optimized-pcm/{name}.f32").read_bytes())
              if len(x) != len(y) or len(x) != int(b[1]):
                  raise SystemExit(f"Invalid PCM test lengths for {name}: {len(x)}, {len(y)}")
              max_error=max((abs(left-right) for left,right in zip(x,y)), default=0.0)
              rms_error=math.sqrt(sum((left-right)**2 for left,right in zip(x,y))/max(1,len(x)))
              differences=sum(left != right for left,right in zip(x,y))
              print(f"{name}: max-absolute-difference={max_error:.10g}, rms={rms_error:.10g}, samples-different={differences}/{len(x)}")
              # RBJ filter coefficient sharing can change last-bit floating
              # rounding. Reject any meaningful PCM error rather than requiring
              # bit-for-bit equality from a refactored calculation order.
              max_allowed=5.0e-7
              rms_allowed=5.0e-8
              if (b[0], b[1]) != (a[0], a[1]) or not math.isfinite(max_error) or not math.isfinite(rms_error) or max_error>max_allowed or rms_error>rms_allowed:
                  mismatch.append(f"{name}: max error={max_error:.9g}, rms={rms_error:.9g}, different={differences}")
              if b[2] != a[2]:
                  print(f"{name}: last-bit PCM differences within checked tolerance")
          if mismatch:
              raise SystemExit("Audio output differs from original v3:\n" + "\n".join(mismatch))
          print("PASS: all original-v3 B/V/M and polyphony PCM samples within max 5e-7 and RMS 5e-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Aiora-UniversalConstruction-v12-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
