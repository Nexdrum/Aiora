name: Build Android APK

on:
  push:
    branches: [ main, native-android ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: aiOra-android-0.7.8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android toolchain
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Native project-limit regression tests
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src/main/cpp \
            tests/native_limit_regression.cpp \
            app/src/main/cpp/{ProjectCore.cpp,ProjectPlayback.cpp,ProjectCodec.cpp,ProjectStorage.cpp,FactoryPresets.cpp,NexdrumKit.cpp,SpectrachordVoice.cpp,FxProcessor.cpp,SongExport.cpp} \
            -o /tmp/aiora-native-limit-regression
          /tmp/aiora-native-limit-regression

      - name: A/B original v3 vs optimized B/V/M audio and CPU benchmark
        run: |
          set -euo pipefail
          # Compile the original v3 engine separately, without altering the branch.
          git fetch --no-tags --depth=1 origin d3b303a7f01458ce15a18bc105f8cbc040c751c0
          BASE=/tmp/aiora-dsp-baseline
          git worktree add --detach "$BASE" d3b303a7f01458ce15a18bc105f8cbc040c751c0
          cp tests/native_cymbal_cpu_benchmark.cpp "$BASE/tests/native_cymbal_cpu_benchmark.cpp"
          g++ -std=c++20 -O3 -pthread -I"$BASE/app/src/main/cpp" \
            "$BASE/tests/native_cymbal_cpu_benchmark.cpp" \
            "$BASE/app/src/main/cpp/"{ProjectCore.cpp,ProjectPlayback.cpp,ProjectCodec.cpp,ProjectStorage.cpp,FactoryPresets.cpp,NexdrumKit.cpp,SpectrachordVoice.cpp,FxProcessor.cpp,SongExport.cpp} \
            -o /tmp/aiora-benchmark-baseline
          mkdir -p /tmp/aiora-original-pcm /tmp/aiora-optimized-pcm
          DSP_BENCH_PCM_DIR=/tmp/aiora-original-pcm /tmp/aiora-benchmark-baseline | tee /tmp/aiora-benchmark-original.txt
          # Compile the current optimized engine with the same flags and sound data.
          g++ -std=c++20 -O3 -pthread -Iapp/src/main/cpp \
            tests/native_cymbal_cpu_benchmark.cpp \
            app/src/main/cpp/{ProjectCore.cpp,ProjectPlayback.cpp,ProjectCodec.cpp,ProjectStorage.cpp,FactoryPresets.cpp,NexdrumKit.cpp,SpectrachordVoice.cpp,FxProcessor.cpp,SongExport.cpp} \
            -o /tmp/aiora-benchmark-optimized
          DSP_BENCH_PCM_DIR=/tmp/aiora-optimized-pcm /tmp/aiora-benchmark-optimized | tee /tmp/aiora-benchmark-optimized.txt
          python3 - <<'PY'
          import re, array, math
          from pathlib import Path
          def cases(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  if not line.startswith("DSP_BENCH "):
                      continue
                  m = re.fullmatch(
                      r"DSP_BENCH ([\w-]+) voices=(\d+) frames=(\d+) hash=([0-9a-f]+) ms=([\d.]+) energy=([\d.eE+-]+)",
                      line,
                  )
                  if not m:
                      raise SystemExit("Unexpected benchmark output: " + line)
                  name, voices, frames, fingerprint, milliseconds, energy = m.groups()
                  result[name] = (voices, frames, fingerprint, float(milliseconds), float(energy))
              return result
          before = cases("/tmp/aiora-benchmark-original.txt")
          after = cases("/tmp/aiora-benchmark-optimized.txt")
          if not before or before.keys() != after.keys():
              raise SystemExit("Incomplete reference/optimized benchmark cases")
          mismatch = []
          for name, b in before.items():
              a = after[name]
              delta = 100 * (b[3] - a[3]) / b[3] if b[3] else 0
              print(f"{name}: baseline={b[3]:.3f}ms optimized={a[3]:.3f}ms speedup={delta:+.1f}%")
              x = array.array("f")
              y = array.array("f")
              x.frombytes(Path(f"/tmp/aiora-original-pcm/{name}.f32").read_bytes())
              y.frombytes(Path(f"/tmp/aiora-optimized-pcm/{name}.f32").read_bytes())
              if len(x) != len(y) or len(x) != int(b[1]):
                  raise SystemExit(f"Invalid PCM test lengths for {name}: {len(x)}, {len(y)}")
              max_error=max((abs(left-right) for left,right in zip(x,y)), default=0.0)
              rms_error=math.sqrt(sum((left-right)**2 for left,right in zip(x,y))/max(1,len(x)))
              differences=sum(left != right for left,right in zip(x,y))
              print(f"{name}: max-absolute-difference={max_error:.10g}, rms={rms_error:.10g}, samples-different={differences}/{len(x)}")
              if (b[0], b[1], b[2]) != (a[0], a[1], a[2]):
                  mismatch.append(f"{name}: max error={max_error:.9g}, rms={rms_error:.9g}, different={differences}")
          if mismatch:
              raise SystemExit("Audio output differs from original v3:\n" + "\n".join(mismatch))
          print("PASS: every sample fingerprint matches original v3 for all B/V/M and polyphony cases")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Aiora-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
